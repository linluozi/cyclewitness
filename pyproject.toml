[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclewitness"
version = "0.1.0"
description = "Static import cycles aligned with runtime partial-initialisation reads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["imports", "cycles", "diagnostics", "python"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
cyclewitness = "cyclewitness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
